openapi: 3.0.3
info:
  title: API Contacts & Authentification
  description: API REST CRUD pour la gestion des contacts, sécurisée par JWT (Bearer token).
  version: 1.0.0

servers:
  - url: http://localhost:5000/api
    description: Serveur de développement local

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Saisissez votre token JWT obtenu via POST /auth/login.
        Header attendu : `Authorization: Bearer <token>`

  schemas:
    UserCredentials:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: cengiz@example.com
        password:
          type: string
          format: password
          example: mdpSecure33!

    ContactInput:
      type: object
      required:
        - name
        - age
      properties:
        name:
          type: string
          example: Bob
        age:
          type: integer
          example: 29

    Contact:
      allOf:
        - $ref: '#/components/schemas/ContactInput'
        - type: object
          properties:
            _id:
              type: string
              example: 65f1234567890abcdef12345

    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          nullable: true
        message:
          type: string
          example: Opération réussie
        total:
          type: string
          example: "1"

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        message:
          type: string
          example: Connexion réussie

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Accès refusé : token manquant ou invalide

paths:
  /auth/register:
    post:
      tags:
        - Authentification
      summary: Inscrire un nouvel utilisateur
      description: Crée un compte utilisateur avec un email unique et un mot de passe haché.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCredentials'
      responses:
        '201':
          description: Utilisateur enregistré avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Données invalides ou email déjà utilisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags:
        - Authentification
      summary: Connexion utilisateur
      description: Vérifie les identifiants et renvoie un JSON Web Token (JWT).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCredentials'
      responses:
        '200':
          description: Connexion réussie, token JWT retourné
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Identifiants invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /contacts:
    get:
      tags:
        - Contacts
      summary: Lister tous les contacts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Liste des contacts récupérée avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Token manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Contacts introuvables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Contacts
      summary: Ajouter un nouveau contact
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
      responses:
        '201':
          description: Contact créé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Token manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erreur lors de la création du contact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /contacts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identifiant MongoDB du contact
        schema:
          type: string
          example: 65f1234567890abcdef12345

    get:
      tags:
        - Contacts
      summary: Récupérer un contact par son ID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Contact trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Token manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Contact introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Contacts
      summary: Mettre à jour un contact existant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
      responses:
        '200':
          description: Contact mis à jour avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Requête invalide ou contact non mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Contacts
      summary: Supprimer un contact par son ID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Contact supprimé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Token manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Contact introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'